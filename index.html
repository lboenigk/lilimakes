<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1 id="site-name"></h1>
    <p id="site-intro"></p>
    <a id="site-email"></a>
  </header>

  <nav class="filters" id="filters" aria-label="Filter projects by category"></nav>

  <main id="projects"></main>

  <dialog id="viewer" aria-label="Enlarged photo">
    <div class="viewer-stage">
      <button type="button" class="viewer-nav viewer-prev" aria-label="Previous photo">&#8249;</button>
      <img alt="">
      <video controls playsinline></video>
      <button type="button" class="viewer-nav viewer-next" aria-label="Next photo">&#8250;</button>
    </div>
    <div class="viewer-foot">
      <p class="viewer-caption"></p>
      <p class="viewer-count"></p>
      <button type="button" class="viewer-close">Close</button>
    </div>
  </dialog>

  <!-- Your content lives in projects.js -->
  <script src="projects.js"></script>
  <script>
    function el(tag, cls, text) {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text) n.textContent = text;
      return n;
    }

    // Header
    document.title = SITE.name + " | Projects";
    document.getElementById("site-name").textContent = SITE.name;
    document.getElementById("site-intro").textContent = SITE.intro;
    const email = document.getElementById("site-email");
    if (SITE.email) {
      email.href = "mailto:" + SITE.email;
      email.textContent = SITE.email;
    } else {
      email.remove();
    }

    // Photo viewer
    const viewer = document.getElementById("viewer");
    const viewerImg = viewer.querySelector("img");
    const viewerVid = viewer.querySelector("video");
    const viewerCap = viewer.querySelector(".viewer-caption");
    const viewerCount = viewer.querySelector(".viewer-count");
    const isVideo = (src) => /\.(mov|mp4|webm|m4v)$/i.test(src);
    let viewerItems = [];
    let viewerIndex = 0;

    function showViewerItem(i) {
      viewerIndex = (i + viewerItems.length) % viewerItems.length;
      const item = viewerItems[viewerIndex];
      viewerVid.pause();
      if (isVideo(item.src)) {
        viewerImg.hidden = true;
        viewerImg.removeAttribute("src");
        viewerVid.hidden = false;
        viewerVid.src = item.src;
      } else {
        viewerVid.hidden = true;
        viewerVid.removeAttribute("src");
        viewerImg.hidden = false;
        viewerImg.src = item.src;
        viewerImg.alt = item.alt;
      }
      viewerCap.textContent = item.caption || "";
      const multi = viewerItems.length > 1;
      viewerCount.textContent = multi ? (viewerIndex + 1) + " / " + viewerItems.length : "";
      viewer.querySelectorAll(".viewer-nav").forEach((b) => { b.hidden = !multi; });
    }
    function openViewer(items, index) {
      viewerItems = items;
      showViewerItem(index);
      viewer.showModal();
    }
    viewer.querySelector(".viewer-prev").addEventListener("click", () => showViewerItem(viewerIndex - 1));
    viewer.querySelector(".viewer-next").addEventListener("click", () => showViewerItem(viewerIndex + 1));
    viewer.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") { e.preventDefault(); showViewerItem(viewerIndex - 1); }
      if (e.key === "ArrowRight") { e.preventDefault(); showViewerItem(viewerIndex + 1); }
    });
    viewer.addEventListener("close", () => viewerVid.pause());
    viewer.querySelector(".viewer-close").addEventListener("click", () => viewer.close());
    viewer.addEventListener("click", (e) => { if (e.target === viewer) viewer.close(); });

    // Blurb text: [link text](https://...) becomes a link
    function blurbParagraph(text) {
      const para = el("p", "blurb");
      const linkPattern = /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g;
      let last = 0;
      let m;
      while ((m = linkPattern.exec(text))) {
        para.append(text.slice(last, m.index));
        const a = el("a", null, m[1]);
        a.href = m[2];
        a.target = "_blank";
        a.rel = "noopener";
        para.append(a);
        last = m.index + m[0].length;
      }
      para.append(text.slice(last));
      return para;
    }

    // Projects
    const main = document.getElementById("projects");
    const sections = PROJECTS.map((p) => {
      const section = el("section", "project");
      section.dataset.category = (p.category || "").toLowerCase();

      const head = el("div", "project-head");
      head.append(el("h2", null, p.title));
      if (p.year) head.append(el("p", "project-year", p.year));
      if (p.category) head.append(el("p", "project-category", p.category));

      const body = el("div", "project-body");
      (p.blurb || "").split(/\n\s*\n/).forEach((para) => {
        if (para.trim()) body.append(blurbParagraph(para.trim()));
      });

      const grid = el("div", "photos");
      const items = (p.photos || []).map((ph) => ({
        src: ph.src, caption: ph.caption, alt: ph.caption || p.title,
      }));
      (p.photos || []).forEach((ph, i) => {
        const fig = el("figure");
        const alt = ph.caption || p.title;
        if (isVideo(ph.src)) {
          const vid = el("video", "photo-video");
          vid.src = ph.src;
          vid.controls = true;
          vid.playsInline = true;
          vid.preload = "metadata";
          vid.setAttribute("aria-label", alt);
          fig.append(vid);
        } else {
          const btn = el("button", "photo-btn");
          btn.type = "button";
          btn.setAttribute("aria-label", "Enlarge photo: " + alt);
          const img = el("img");
          img.src = ph.src;
          img.alt = alt;
          img.loading = "lazy";
          btn.append(img);
          btn.addEventListener("click", () => openViewer(items, i));
          fig.append(btn);
        }
        if (ph.caption) fig.append(el("figcaption", null, ph.caption));
        grid.append(fig);
      });

      body.append(grid);
      section.append(head, body);
      main.append(section);
      return section;
    });

    // Category filter: the chosen category moves to the top
    const filters = document.getElementById("filters");
    const categories = [...new Set(sections.map((s) => s.dataset.category).filter(Boolean))];
    function applyFilter(cat) {
      const matches = sections.filter((s) => !cat || s.dataset.category === cat);
      const rest = sections.filter((s) => !matches.includes(s));
      [...matches, ...rest].forEach((s) => {
        s.classList.toggle("dimmed", !!cat && !matches.includes(s));
        main.append(s);
      });
      filters.querySelectorAll("button").forEach((b) => {
        b.setAttribute("aria-pressed", String(b.dataset.cat === cat));
      });
    }
    if (categories.length > 1) {
      ["", ...categories].forEach((cat) => {
        const b = el("button", "filter-btn", cat || "all");
        b.type = "button";
        b.dataset.cat = cat;
        b.addEventListener("click", () => applyFilter(cat));
        filters.append(b);
      });
      applyFilter("");
    } else {
      filters.remove();
    }
  </script>
</body>
</html>
